[platformio]
default_envs = esp8266

[env]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
; Bake config.env -> src/secrets.h + data/*.cfg, and web/*.html -> src/page.h before every build.
extra_scripts =
    pre:tools/gen_config.py
    pre:tools/build_web.py

; ---- ESP32 (original targets) ----
[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv

[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv

; ---- ESP8266 port ----
; 4 MB flash, LittleFS partition for the blocklist. 4m2m = 2 MB FS (blocklist),
; ~1 MB sketch + a ~1 MB OTA region (firmware OTA over the air DOES work here);
; use 4m1m for a smaller (1 MB) filesystem if you prefer.
[env:esp8266]
platform = espressif8266
board = esp12e
board_build.ldscript = eagle.flash.4m2m.ld
; 20/80 CPU win: the ESP8266 runs at 160 MHz (default 80). ~2x CPU for the hashing/matching
; hot path and the WiFi stack. Costs power/heat — revert to 80 MHz if the supply sags (watch vcc).
board_build.f_cpu = 160000000L
; Aggressive optimization (-O3 instead of the default -Os): faster CPU-bound paths
; (FNV hashing, glob/strcmp, block parsing). Costs flash; DNS latency is I/O-bound
; (flash + WiFi), so the wall-clock gain is small. Drop -O3 / restore -Os if flash-tight.
build_unflags =
    -Os
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -O3
