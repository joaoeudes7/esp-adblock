[platformio]
default_envs = esp8266

[env]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
; Bake config.env -> src/secrets.h + data/*.cfg, and web/*.html -> src/page.h before every build.
extra_scripts =
    pre:tools/gen_config.py
    pre:tools/build_web.py

; ---- ESP32 (original targets) ----
[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv

[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv

; ---- ESP8266 port ----
; 4 MB flash, LittleFS partition for the blocklist. 4m2m = 2 MB FS (blocklist),
; ~1 MB sketch (single app: firmware OTA over the air is NOT available at 2m2m;
; use 4m1m if you need OTA + a smaller blocklist).
[env:esp8266]
platform = espressif8266
board = esp12e
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
