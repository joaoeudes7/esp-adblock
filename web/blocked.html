<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Blocked</title><style>
:root{--bg:#0d1117;--surface:#161b22;--line:#30363d;--ink:#e6edf3;--muted:#9aa4b2;--ok:#3fb950}
*{box-sizing:border-box}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink)}
.card{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;text-align:center}
.icon{font-size:40px;line-height:1}
h1{font-size:18px;font-weight:650;margin:14px 0 6px;word-break:break-all}
p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.b{color:var(--ink);font-weight:600}
button{font:inherit;width:100%;padding:12px;border:0;border-radius:8px;background:var(--ok);color:#04150a;font-weight:650;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.msg{margin:14px 0 0;font-size:13px;color:var(--muted);min-height:18px}
.fine{margin-top:8px;font-size:12px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class=card>
  <div class=icon aria-hidden=true>🛡️</div>
  <h1>{{HOST}}</h1>
  <p>This site is on the <span class=b>{{REASON}}</span> list, so it was blocked. That's what keeps ads and trackers out of your network.</p>
  <button id=b>Allow this site</button>
  <p class=msg id=m></p>
  <p class=fine>The site stays allowed until you remove it from the blocklist.</p>
</div>
<script>
document.getElementById('b').onclick=function(){
  var b=this;b.disabled=true;var m=document.getElementById('m');m.textContent='Allowing…';
  fetch('/allow?d='+encodeURIComponent(location.hostname),{headers:{'X-Requested-With':'esp-adblock'}})
   .then(function(r){m.textContent=r.ok?'Allowed. Reload the page in about 30 seconds.':'Could not allow it. Try again.';if(r.ok)b.textContent='Allowed';else b.disabled=false})
   .catch(function(){m.textContent='Network error. Try again.';b.disabled=false})};
</script>
</body></html>
