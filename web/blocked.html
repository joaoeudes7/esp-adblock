<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Blocked</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --line: #30363d;
        --ink: #e6edf3;
        --muted: #9aa4b2;
        --ok: #3fb950;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font:
          15px/1.55 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px 24px;
        text-align: center;
      }
      .icon {
        color: var(--ok);
      }
      .icon svg {
        width: 40px;
        height: 40px;
      }
      h1 {
        font-size: 18px;
        font-weight: 650;
        margin: 14px 0 6px;
        overflow-wrap: anywhere;
        word-break: normal;
      }
      p {
        color: var(--muted);
        font-size: 13.5px;
        margin: 0 0 18px;
      }
      .b {
        color: var(--ink);
        font-weight: 600;
      }
      button {
        font: inherit;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: var(--ok);
        color: #04150a;
        font-weight: 650;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button.sec {
        background: transparent;
        color: var(--ok);
        border: 1px solid var(--ok);
        margin-top: 8px;
      }
      button:focus-visible {
        outline: 2px solid var(--ok);
        outline-offset: 2px;
      }
      .msg {
        margin: 14px 0 0;
        font-size: 13px;
        color: var(--muted);
        min-height: 18px;
      }
      .fine {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      a {
        color: var(--ok);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
          />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </div>
      <h1>{{HOST}}</h1>
      <p>
        This site is on the <span class="b">{{REASON}}</span> list, so it was blocked. That's what keeps ads and
        trackers out of your network.
      </p>
      <button id="b">Allow this site</button>
      <button id="t" class="sec">Continue for 5 minutes</button>
      <p class="msg" id="m" role="status" aria-live="polite"></p>
      <p class="fine">
        “Allow” keeps the site unblocked until you remove it. “Continue for 5 minutes” unblocks it temporarily.
      </p>
      <p class="fine">Managed by <a href="http://{{ESP}}/">ESP ADBlock</a></p>
    </div>
    <script>
      function allow(secs) {
        var m = document.getElementById('m'),
          bb = document.getElementById('b'),
          tb = document.getElementById('t')
        bb.disabled = tb.disabled = true
        m.textContent = 'Allowing…'
        var url = '/allow?d=' + encodeURIComponent(location.hostname) + (secs ? '&s=' + secs : '')
        fetch(url, { headers: { 'X-Requested-With': 'esp-adblock' } })
          .then(function (r) {
            if (r.ok) {
              m.textContent = secs ? 'Allowed for 5 minutes. Reloading…' : 'Allowed for good. Reloading…'
              ;(secs ? tb : bb).textContent = secs ? 'Allowed (5 min)' : 'Allowed'
              setTimeout(function () {
                location.reload()
              }, 12000)
            } else {
              m.textContent = 'Could not allow it. Try again.'
              bb.disabled = tb.disabled = false
            }
          })
          .catch(function () {
            m.textContent = 'Network error. Try again.'
            bb.disabled = tb.disabled = false
          })
      }
      document.getElementById('b').onclick = function () {
        allow(0)
      }
      document.getElementById('t').onclick = function () {
        allow(300)
      }
    </script>
  </body>
</html>
