name: blocklist

# Rebuilds the default blocklist weekly and publishes it at a stable URL:
#   https://github.com/<owner>/<repo>/releases/download/blocklist/blocklist.bin   (device, http only on ESP8266)
#   https://raw.githubusercontent.com/<owner>/<repo>/blocklist/blocklist.bin      (CORS: browser download)
# Set that as the device's Remote auto-update URL (config.env UPDATE_URL, or the
# dashboard's /setupdate). The blob is the BLM1 bloom format this fork reads.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: blocklist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build default blocklist (fails if any source is unreachable)
        run: |
          set -o pipefail
          python3 tools/build_bloom.py blocklist.bin 2>&1 | tee build.log
      - name: Sanity checks (BLM1)
        run: |
          size=$(stat -c%s blocklist.bin)
          magic=$(head -c4 blocklist.bin)
          n=$(python3 -c "import struct;print(struct.unpack('<I',open('blocklist.bin','rb').read(8)[4:8])[0])")
          echo "size=$size magic=$magic domains=$n"
          test "$magic" = "BLM1"
          test "$n" -gt 40000                 # catches a silently shrunk list
          test "$size" -lt 1400000            # fits the 2 MB filesystem partition
      - name: Publish to the 'blocklist' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python3 -c "import struct;print(struct.unpack('<I',open('blocklist.bin','rb').read(8)[4:8])[0])")
          notes="Auto-built $(date -u +%F) — ${n} domains (BLM1 bloom; default multi-source: StevenBlack + Hagezi Pro.plus + OISD Big + Hagezi DoH/DoT + Hagezi TIF.mini + Turtlecute).

          Set this as the device's Remote auto-update URL:
          https://github.com/${{ github.repository }}/releases/download/blocklist/blocklist.bin"
          if gh release view blocklist >/dev/null 2>&1; then
            gh release edit blocklist --notes "$notes"
          else
            gh release create blocklist --title "Weekly blocklist" --notes "$notes" --latest=false
          fi
          gh release upload blocklist blocklist.bin --clobber
      - name: Publish a CORS-friendly copy on the 'blocklist' branch
        run: |
          # raw.githubusercontent.com sends access-control-allow-origin: *, so the
          # dashboard's "Download & upload" (browser does the TLS) can fetch it.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan blocklist-publish
          git add -f blocklist.bin
          git commit -m "blocklist: $(date -u +%F)" || { echo "no change"; exit 0; }
          git push --force origin blocklist-publish:blocklist
